<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Hub</title>
<link rel="icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4da/512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="binder" id="binder" aria-label="Navigation"></aside>
  <div>
    <div class="mobile-bar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <strong>Study Hub</strong>
    </div>
    <main class="main" id="main"><div class="loading"><div><div class="spinner"></div><p>Opening your binder&#x2026;</p></div></div></main>
  </div>
</div>
<section class="dock hidden" id="dock" aria-label="Music player">
  <div class="dock-video"><div id="ytPlayer"></div></div>
  <div class="dock-body">
    <div class="dock-top">
      <div class="dock-info"><div class="dock-title" id="dkTitle">Nothing playing</div><div class="dock-sub" id="dkSub"></div></div>
      <a class="icon-btn" id="dkYt" href="#" target="_blank" rel="noopener" title="Open on YouTube" aria-label="Open on YouTube"></a>
      <button class="icon-btn" data-act="p-min" id="dkMin" title="Make player smaller" aria-label="Make player smaller"></button>
      <button class="icon-btn" data-act="p-close" title="Stop and close player" aria-label="Stop and close player"></button>
    </div>
    <div class="dock-progress"><span id="dkCur">0:00</span><input type="range" id="dkSeek" min="0" max="1000" value="0" aria-label="Song position"><span id="dkDur">0:00</span></div>
    <div class="dock-controls">
      <button class="icon-btn" data-act="p-shuffle" id="dkShuffle" title="Shuffle" aria-label="Shuffle"></button>
      <button class="icon-btn" data-act="p-prev" id="dkPrev" title="Previous" aria-label="Previous"></button>
      <button class="icon-btn play" data-act="p-toggle" id="dkPlay" title="Play" aria-label="Play"></button>
      <button class="icon-btn" data-act="p-next" id="dkNext" title="Next" aria-label="Next"></button>
      <button class="icon-btn rep" data-act="p-repeat" id="dkRepeat" title="Repeat" aria-label="Repeat"></button>
      <span class="vol"><span id="dkVolIcon"></span><input type="range" id="dkVol" min="0" max="100" value="70" aria-label="Volume"></span>
    </div>
  </div>
</section>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/app2.js"></script>
<script>
setTimeout(function () {
  if (window.__shPart1 && window.__shPart2) return;
  var missing = !window.shApi ? 'js/api.js' : !window.__shPart1 ? 'js/app.js' : 'js/app2.js';
  document.body.innerHTML = '<div style="max-width:560px;margin:60px auto;font-family:sans-serif;line-height:1.6;padding:0 16px">' +
    '<h2>Study Hub could not start<\/h2><p>The file <b>' + missing + '<\/b> did not load or has a typing error. ' +
    'Check that it was uploaded to the repository in full, then reload this page.<\/p><\/div>';
}, 8000);
</script>
</body>
</html>
